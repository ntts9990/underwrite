[project]
name = "underwrite"
version = "0.1.1"
description = "Local evidence normalization, measurement, and acceptance checks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "underwrite-core>=0.1.0,<0.2",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/ntts9990/underwrite"
Issues = "https://github.com/ntts9990/underwrite/issues"

[project.scripts]
underwrite = "underwrite.cli.main:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "underwrite"
module-root = "src"
source-include = [
    "contracts/evidence_result.v1.schema.json",
    "contracts/common_result_inspection.v1.schema.json",
    "contracts/common_result_inspection_actions.v1.schema.json",
    "contracts/metric_definition.v1.schema.json",
    "contracts/deepeval_bound_record.v1.schema.json",
    "contracts/deepeval_metric_bindings.v1.schema.json",
    "contracts/deepeval_metric_bindings.v2.schema.json",
    "contracts/evidence_result.v2.schema.json",
    "contracts/deepeval_bound_record.v2.schema.json",
    "contracts/common_result_inspection.v2.schema.json",
    "contracts/common_result_inspection_actions.v2.schema.json",
    "contracts/measurement_semantics.v1.schema.json",
    "contracts/measurement_policy.v3.schema.json",
    "contracts/read.v2.schema.json",
    "contracts/declared_claims.v2.schema.json",
    "contracts/acceptance_decision.v2.schema.json",
    "contracts/read.v1.schema.json",
    "contracts/measurement_policy.v2.schema.json",
    "contracts/measurement_error.v1.schema.json",
    "contracts/measurement_record.v1.schema.json",
    "contracts/baseline_record.v1.schema.json",
    "contracts/measurement_replay.v1.schema.json",
    "contracts/statistical_seed.v1.schema.json",
    "contracts/observation.v1.schema.json",
    "contracts/artifact_case.v1.schema.json",
    "contracts/artifact_inspection.v1.schema.json",
    "contracts/artifact_inspection_error.v1.schema.json",
    "contracts/release_case.v1.schema.json",
    "contracts/release_inspection.v1.schema.json",
    "contracts/release_inspection_error.v1.schema.json",
    "contracts/declared_claims.v1.schema.json",
    "contracts/change_candidate.v1.schema.json",
    "contracts/acceptance_decision.v1.schema.json",
    "contracts/acceptance_error.v1.schema.json",
    "contracts/gate_rules.v1.schema.json",
    "contracts/evidence_error.v1.schema.json",
    "contracts/promptfoo_accounting.v1.schema.json",
    "contracts/promptfoo_row_index.v1.schema.json",
    "contracts/promptfoo_record.v1.schema.json",
    "contracts/promptfoo_accounting.v2.schema.json",
    "contracts/promptfoo_row_index.v2.schema.json",
    "contracts/promptfoo_record.v2.schema.json",
    "contracts/deepeval_accounting.v1.schema.json",
    "contracts/deepeval_record.v1.schema.json",
    "contracts/deepeval_accounting.v2.schema.json",
    "contracts/deepeval_accounting.v3.schema.json",
    "contracts/deepeval_trace_index.v2.schema.json",
    "contracts/deepeval_record.v3.schema.json",
    "contracts/deepeval_trace_record.v2.schema.json",
    "contracts/deepeval_record.v2.schema.json",
    "contracts/deepeval_trace_index.v1.schema.json",
    "contracts/deepeval_trace_record.v1.schema.json",
    "contracts/langfuse_accounting.v1.schema.json",
    "contracts/langfuse_row_index.v1.schema.json",
    "contracts/langfuse_cli_accounting.v1.schema.json",
    "contracts/langfuse_cli_row_index.v1.schema.json",
    "contracts/langfuse_cli_record.v1.schema.json",
    "contracts/langfuse_record.v1.schema.json",
    "contracts/langfuse_accounting.v2.schema.json",
    "contracts/langfuse_row_index.v2.schema.json",
    "contracts/langfuse_record.v2.schema.json",
    "contracts/declared_comparison_case.v1.schema.json",
    "contracts/declared_comparison.v1.schema.json",
    "contracts/paired_binary_input.v1.schema.json",
    "contracts/paired_binary_policy.v1.schema.json",
    "contracts/paired_binary_evidence.v1.schema.json",
    "contracts/paired_review_context.v1.schema.json",
    "contracts/paired_review.v1.schema.json",
    "contracts/paired_handoff_review.v1.schema.json",
    "contracts/record_spec.v1.schema.json",
    "contracts/result_record.v1.schema.json",
    "contracts/record_view.v1.schema.json",
    "contracts/record_document.v1.schema.json",
    "contracts/record_catalog.v1.schema.json",
    "contracts/record_verification.v1.schema.json",
    "contracts/record_error.v1.schema.json",
