# OpenTelemetry Collector (otelcol-contrib 0.160.0) config for the underwrite golden capture.
# OTLP/HTTP in on loopback only, one file exporter out, JSON format, no rotation:
# each export batch becomes one JSON line, and the sender flushes exactly once, so the
# resulting file is one JSON document (ExportTraceServiceRequest in OTLP/JSON encoding).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  file:
    path: out/capture.json
    format: json
    flush_interval: 1s

service:
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
