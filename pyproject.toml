[tool.uv.workspace]
members = ["packages/underwrite-core"]

[tool.uv.sources]
underwrite-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "pyright",
    "import-linter",
    "deptry",
    "readme-renderer[md]==46.0",
]
pure = [
    "underwrite-core",
    "pytest",
    "hypothesis",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 50
max-branches = 12

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = [
    "src",
    "packages/underwrite-core/src",
    "packages/underwrite-core/tests",
    "packages/underwrite-core/build",
    "tests",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/underwrite-core/tests"]
pythonpath = ["tests", "src"]

[tool.deptry]
known_first_party = [
    "underwrite", "underwrite_core", "_schema_compose", "_record_schema",
    "build_deepeval_accounting", "build_deepeval_record", "build_langfuse_record",
    "build_common_result_inspection_actions", "build_deepeval_bound_record",
    "build_deepeval_metric_bindings",
]
# The workspace distribution imports as underwrite_core.
package_module_name_map = { "underwrite-core" = ["underwrite_core"] }
# Producer capture recipes run only in isolated SDK environments.
extend_exclude = ["packages/.*/tests", "fixtures/golden", "fixtures/examples/deepeval-auto-4.3.1"]
