name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - name: Test application, core, and installed package resources
        run: uv run --frozen --no-sync python -m pytest
      - run: uv run --frozen --no-sync ruff check
      - run: uv run --frozen --no-sync pyright
      - run: uv run --frozen --no-sync lint-imports
      - run: uv run --frozen --no-sync deptry .
      - name: Build both distributions
        run: uv build --all-packages
      - name: Test pure modules without application dependencies
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-pure uv sync --frozen --only-group pure
          UV_PROJECT_ENVIRONMENT=.venv-pure uv run --frozen --no-sync python -I -m pytest tests/unit/pure packages/underwrite-core/tests
