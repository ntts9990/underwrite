[project]
name = "underwrite-core"
version = "0.0.1"
description = "Dependency-free canonical evidence and integrity primitives"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "underwrite_core"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
